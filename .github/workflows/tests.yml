name: Tests

# Valida typecheck + tests unitarios (jest, 100% mockeado, sin DB) en cada PR.
# El job "test" es check requerido en la protección de dev y main.
# Además publica el check "Jest tests" ("N specs: X passed, Y failed, Z skipped")
# con el detalle por archivo, a partir del JUnit de jest-junit
# (.github/scripts/jest-check.js).

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # fallback: crear el check con el token del workflow si no hay App

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.CI_APP_ID != '' }}   # el if de un step no ve su propio env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci --silent --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_SUITE_NAME: '{filepath}'
          JEST_JUNIT_CLASSNAME: '{classname}'
          JEST_JUNIT_TITLE: '{title}'
          JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'

      # Con la GitHub App "ESCORIAL Trazabilidad CI" (secretos CI_APP_ID /
      # CI_APP_PRIVATE_KEY) el check aparece suelto, con el ícono de la app.
      # Sin los secretos usa el token del workflow y queda agrupado bajo "Tests /".
      - name: Token de la GitHub App
        id: app-token
        if: ${{ !cancelled() && env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Check "Jest tests"
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const run = require('./.github/scripts/jest-check.js');
            await run({ github, context, core });
