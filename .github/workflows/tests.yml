name: Tests

# Valida typecheck + tests unitarios (jest, 100% mockeado, sin DB) en cada PR.
# El job "test" es check requerido en la protección de dev y main.
# Además publica el check "Jest" con el resumen (N passed, N failed) y el
# detalle por archivo, vía dorny/test-reporter sobre el JUnit de jest-junit.

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # dorny/test-reporter crea el check run con el resumen

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci --silent --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_SUITE_NAME: '{filepath}'
          JEST_JUNIT_CLASSNAME: '{classname}'
          JEST_JUNIT_TITLE: '{title}'
          JEST_JUNIT_ADD_FILE_ATTRIBUTE: 'true'

      - name: Reporte de tests
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Jest
          path: reports/junit.xml
          reporter: jest-junit
          fail-on-error: false
